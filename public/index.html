<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#12071a">
    <meta name="description" content="Un blind test musical solo, gratuit et sans compte.">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/app.css">
    <title>MelodyMasters — Blind test musical</title>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <main id="app" class="app-shell"></main>
    <dialog id="dialog" class="dialog">
      <form method="dialog" class="dialog-card">
        <button type="button" class="icon-button dialog-close" data-action="stay" aria-label="Fermer">×</button>
        <div id="dialog-content"></div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
